<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>나만의 AI 비서</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>나만의 AI 비서</h1>
    <nav class="tabs">
      <button class="tab-btn active" data-tab="chat">채팅</button>
      <button class="tab-btn" data-tab="data">데이터 관리</button>
      <button class="tab-btn" data-tab="history">대화 기록</button>
    </nav>
  </header>

  <!-- 탭 1: 채팅 -->
  <section id="tab-chat" class="tab-panel active">
    <div id="summary-box" class="summary-box">요약 정보를 불러오는 중...</div>
    <div id="chat-log" class="chat-log"></div>
    <div id="chat-loading" class="loading hidden">AI가 답변을 작성 중입니다...</div>
    <form id="chat-form" class="chat-input-row">
      <input id="chat-input" type="text" placeholder="질문을 입력하세요" autocomplete="off" required />
      <button type="submit">전송</button>
    </form>
  </section>

  <!-- 탭 2: 데이터 관리 -->
  <section id="tab-data" class="tab-panel">
    <form id="data-form" class="data-form">
      <input id="data-date" type="date" required />
      <input id="data-value" type="number" step="any" placeholder="값" required />
      <input id="data-memo" type="text" placeholder="메모 (선택)" />
      <button type="submit">추가</button>
    </form>
    <table id="data-table">
      <thead>
        <tr><th>날짜</th><th>값</th><th>메모</th><th>삭제</th></tr>
      </thead>
      <tbody></tbody>
    </table>
  </section>

  <!-- 탭 3: 대화 기록 -->
  <section id="tab-history" class="tab-panel">
    <ul id="conversation-list" class="conversation-list"></ul>
    <div id="conversation-detail" class="conversation-detail"></div>
  </section>

  <script src="script.js"></script>
</body>
</html>
